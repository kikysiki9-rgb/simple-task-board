<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои задачи</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6fb; color: #202438; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 16px; }
    main { max-width: 620px; margin: auto; padding: 28px; background: white; border-radius: 18px; box-shadow: 0 12px 40px #20243812; }
    h1 { margin: 0 0 8px; }
    .hint { color: #73798c; margin: 0 0 24px; }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #dce0eb; border-radius: 9px; font: inherit; }
    button { padding: 11px 16px; border: 0; border-radius: 9px; background: #5b61e8; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #484ed0; }
    ul { list-style: none; padding: 0; margin: 22px 0 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #eef0f5; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { color: #9297a6; text-decoration: line-through; }
    .delete { padding: 6px 10px; background: #f1f2f7; color: #555b6e; }
    .delete:hover { background: #ffe8e8; color: #bd3434; }
    #empty { color: #9297a6; text-align: center; padding: 18px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Мои задачи</h1>
    <p class="hint">Небольшой список дел — ваши задачи сохраняются в браузере.</p>
    <form id="form"><input id="task" aria-label="Новая задача" placeholder="Например, выпить воды" required maxlength="120"><button>Добавить</button></form>
    <ul id="list"></ul>
    <p id="empty">Пока задач нет. Добавьте первую!</p>
  </main>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#task');
    const list = document.querySelector('#list');
    const empty = document.querySelector('#empty');
    let tasks = JSON.parse(localStorage.getItem('simple-task-board') || '[]');
    function save() { localStorage.setItem('simple-task-board', JSON.stringify(tasks)); render(); }
    function render() {
      list.replaceChildren();
      empty.hidden = tasks.length > 0;
      tasks.forEach((task, index) => {
        const row = document.createElement('li');
        row.className = task.done ? 'done' : '';
        const check = document.createElement('input');
        check.type = 'checkbox'; check.checked = task.done; check.setAttribute('aria-label', 'Отметить задачу выполненной');
        check.addEventListener('change', () => { tasks[index].done = check.checked; save(); });
        const text = document.createElement('span'); text.textContent = task.text;
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'delete'; remove.textContent = 'Удалить';
        remove.addEventListener('click', () => { tasks.splice(index, 1); save(); });
        row.append(check, text, remove); list.append(row);
      });
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false }); input.value = ''; save(); input.focus();
    });
    render();
  </script>
</body>
</html>
